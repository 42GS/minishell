name: Minishell CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  norminette:
    name: Norminette Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/42gs/minishell-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Norminette
        run: |
          norminette src/ include/ libft/

  build_and_test:
    name: Strict Build & Leak Verification
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/42gs/minishell-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mandatory (-Wall -Wextra -Werror)
        run: |
          make -j"$(nproc)" all

      - name: Verify No-Relink (make all)
        run: |
          out=$(make all)
          echo "$out"
          echo "$out" | grep -q "Nothing to be done" || (echo "Relink detected on make all!" && exit 1)

      - name: Build Bonus & Verify No-Relink (make bonus)
        run: |
          make -j"$(nproc)" bonus
          out=$(make bonus)
          echo "$out"
          echo "$out" | grep -q "Nothing to be done" || (echo "Relink detected on make bonus!" && exit 1)

      - name: Verify Clean & Rebuild Rules (fclean / re)
        run: |
          make fclean
          if [ -f minishell ] || [ -f libft/libft.a ] || [ -d obj ]; then
            echo "Clean rule left build artifacts behind!"
            exit 1
          fi
          make re

      - name: Run Automated Unit Tests (with Valgrind)
        run: |
          bash tests/unit/run_unit.sh

      - name: Run Automated E2E Smoke Tests
        run: |
          python3 tests/e2e/run_e2e.py --ci

      - name: Run Full 42evalhub E2E Suites (01-05)
        run: |
          python3 tests/e2e/run_e2e.py --all

      - name: Run Interactive PTY Signal Tests
        run: |
          python3 tests/e2e/test_signals_pty.py

      - name: Run Valgrind Memory & FD Leak Check
        run: |
          bash tests/e2e/run_valgrind_qa.sh
